name: Archive mirami

# mirami: its reels, girls lists and profiles, from its API (~3-5 min).
# The steps are in archive-site.yml. Supabase starts coomeet at minute 0 with
# chain on (supabase/shared/schedule.sql); each site then starts the next.
on:
  workflow_dispatch: # the chain, or Run workflow in the Actions tab
    inputs:
      guest:
        description: Run as a guest (not logged in)
        type: boolean
        default: false
      chain:
        description: Then start luckycrush, and so on down the chain
        type: boolean
        default: false

# One mirami run at a time: a run still going is waited for, not raced.
concurrency:
  group: archive-mirami
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to start the next site's workflow

jobs:
  archive:
    uses: ./.github/workflows/archive-site.yml
    with:
      site: mirami
      browser: false
      faces_minutes: 4
      timeout_minutes: 20
      guest: ${{ inputs.guest }}
      next: ${{ inputs.chain && 'luckycrush' || '' }}
    secrets: inherit
