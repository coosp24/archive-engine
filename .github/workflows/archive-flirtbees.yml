name: Archive flirtbees

# flirtbees: its stories, from its API (under a minute).
# The steps are in archive-site.yml. Supabase starts coomeet at minute 0 with
# chain on (supabase/shared/schedule.sql); each site then starts the next.
on:
  workflow_dispatch: # the chain, or Run workflow in the Actions tab
    inputs:
      guest:
        description: Run as a guest (not logged in)
        type: boolean
        default: false
      chain:
        description: Then start mirami, and so on down the chain
        type: boolean
        default: false

# One flirtbees run at a time: a run still going is waited for, not raced.
concurrency:
  group: archive-flirtbees
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to start the next site's workflow

jobs:
  archive:
    uses: ./.github/workflows/archive-site.yml
    with:
      site: flirtbees
      browser: false
      # Faces are off for now (2026-11-20); set the minutes back to turn them on.
      faces_minutes: 0
      timeout_minutes: 15
      guest: ${{ inputs.guest }}
      next: ${{ inputs.chain && 'mirami' || '' }}
    secrets: inherit
